<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="step1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="step2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="step3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="step4-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="860" height="50" rx="8" fill="url(#header-grad)" />
  <text x="450" y="46" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="0.5">
    TRIALREADY LK — END-TO-END PREDICTIVE AI WORKFLOW
  </text>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(40, 85)">
    <rect width="820" height="105" rx="10" fill="url(#step1-grad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Step Badge -->
    <rect x="15" y="12" width="220" height="26" rx="5" fill="#1e40af" />
    <text x="125" y="29" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.4">
      1. USER TRAINING INPUT
    </text>
    <!-- Bullets -->
    <g transform="translate(20, 52)" font-size="11.5" fill="#1e293b">
      <text x="10" y="14" font-weight="600">• 20h Practical Lessons Completed</text>
      <text x="10" y="36" font-weight="600">• Valid NTMI Medical Clearance</text>
      <text x="290" y="14" font-weight="600">• DMT Learner Permit (≥ 3 Months Wait)</text>
      <text x="290" y="36" font-weight="600">• Theory Mock Exam Score (≥ 75%)</text>
      <text x="580" y="14" font-weight="600">• Maneuver Ratings (1–5 Stars)</text>
      <text x="580" y="36" font-weight="600">• Attendance &amp; Skill Mastery Records</text>
    </g>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <line x1="450" y1="190" x2="450" y2="216" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 2" />

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(40, 220)">
    <rect width="820" height="105" rx="10" fill="url(#step2-grad)" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Step Badge -->
    <rect x="15" y="12" width="270" height="26" rx="5" fill="#6d28d9" />
    <text x="150" y="29" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.4">
      2. AI MULTI-FACTOR ML ENGINE
    </text>
    <!-- Processing Details -->
    <g transform="translate(20, 52)" font-size="11.5" fill="#1e293b">
      <text x="10" y="14" font-weight="600">• Weighted Scoring: Statutory prerequisites, road hours, and maneuver performance</text>
      <text x="10" y="36" font-weight="600">• Risk Detection: Identifies recurring mistakes (Hill Start rollback, Reverse S-Bend drift)</text>
      <text x="580" y="25" font-weight="700" fill="#6d28d9">Neural Classifier /</text>
      <text x="580" y="42" font-weight="700" fill="#6d28d9">Multi-Factor Engine</text>
    </g>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <line x1="450" y1="325" x2="450" y2="351" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 2" />

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(40, 355)">
    <rect width="820" height="105" rx="10" fill="url(#step3-grad)" stroke="#6ee7b7" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Step Badge -->
    <rect x="15" y="12" width="250" height="26" rx="5" fill="#047857" />
    <text x="140" y="29" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.4">
      3. GENERATED AI OUTPUT
    </text>
    <!-- Output Details -->
    <g transform="translate(20, 52)" font-size="11.5" fill="#1e293b">
      <text x="10" y="14" font-weight="600">• Composite Readiness Score: 0% – 100% Scientific Probability</text>
      <text x="10" y="36" font-weight="600">• Dynamic Risk Checklist: Highlights mastered vs. deficient driving skills</text>
      <text x="520" y="14" font-weight="700" fill="#065f46">• Tier 1: Trial Ready (≥ 80%)</text>
      <text x="520" y="36" font-weight="700" fill="#b45309">• Tier 2: Needs Practice (&lt; 80%)</text>
    </g>
  </g>

  <!-- Connecting Arrow 3 -> 4 -->
  <line x1="450" y1="460" x2="450" y2="486" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 2" />

  <!-- ==================== STEP 4 ==================== -->
  <g transform="translate(40, 490)">
    <rect width="820" height="110" rx="10" fill="url(#step4-grad)" stroke="#fcd34d" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Step Badge -->
    <rect x="15" y="12" width="270" height="26" rx="5" fill="#b45309" />
    <text x="150" y="29" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.4">
      4. ACTIONABLE DECISION PATHS
    </text>

    <!-- Branch A: Pass -->
    <g transform="translate(20, 50)">
      <rect width="380" height="48" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
      <text x="12" y="20" font-size="11" font-weight="800" fill="#065f46">IF SCORE ≥ 80% (TRIAL READY):</text>
      <text x="12" y="38" font-size="10.5" font-weight="600" fill="#334155">Issue 1-Click DMT Werahera Trial Slip &amp; A4 Logbook</text>
    </g>

    <!-- Branch B: Practice -->
    <g transform="translate(420, 50)">
      <rect width="380" height="48" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="20" font-size="11" font-weight="800" fill="#991b1b">IF SCORE &lt; 80% (NEEDS PRACTICE):</text>
      <text x="12" y="38" font-size="10.5" font-weight="600" fill="#334155">Launch Adaptive AI Remedial Quiz &amp; Schedule Extra Lessons</text>
    </g>
  </g>
</svg>
