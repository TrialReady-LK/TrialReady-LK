<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft Shadows -->
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="diamond-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#b45309" flood-opacity="0.15" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="start-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="input-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <linearGradient id="process-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>

    <linearGradient id="decision-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <linearGradient id="yes-box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <linearGradient id="no-box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>

    <linearGradient id="yes-term-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="no-term-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <rect x="25" y="15" width="910" height="46" rx="8" fill="url(#header-grad)" />
  <text x="480" y="38" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="800" letter-spacing="0.5">
    TRIALREADY LK — AI TRIAL READINESS EVALUATION FLOWCHART
  </text>
  <text x="480" y="52" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600" letter-spacing="0.3">
    Standard Decision &amp; Process Flow Diagram (ISO/ANSI Flowchart Specification)
  </text>

  <!-- ==================== 1. START TERMINAL ==================== -->
  <g transform="translate(320, 76)">
    <rect width="320" height="40" rx="20" fill="url(#start-grad)" stroke="#60a5fa" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="160" y="25" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700" letter-spacing="0.4">
      START: Trigger Trial Readiness Evaluation
    </text>
  </g>

  <!-- Connector: Start -> Input -->
  <line x1="480" y1="116" x2="480" y2="142" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />

  <!-- ==================== 2. INPUT DATA (PARALLELOGRAM) ==================== -->
  <!-- Parallelogram: Top-Left (140, 145), Top-Right (850, 145), Bottom-Right (820, 245), Bottom-Left (110, 245) -->
  <polygon points="140,145 850,145 820,245 110,245" fill="url(#input-grad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#card-shadow)" />
  
  <!-- Badge: Input Symbol -->
  <rect x="360" y="153" width="240" height="22" rx="4" fill="#1e40af" />
  <text x="480" y="168" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800" letter-spacing="0.4">
    DATA INPUT: CANDIDATE RECORDS
  </text>

  <!-- Input Content (3 Clean Columns) -->
  <g font-size="10.5" fill="#1e293b" font-weight="600">
    <!-- Col 1 -->
    <text x="145" y="196">• 20h Practical Lessons Completed</text>
    <text x="145" y="222">• Valid NTMI Medical Clearance</text>
    
    <!-- Col 2 -->
    <text x="390" y="196">• DMT Learner Permit (≥ 3 Mos Wait)</text>
    <text x="390" y="222">• Theory Mock Exam Score (≥ 75%)</text>
    
    <!-- Col 3 -->
    <text x="650" y="196">• Maneuver Ratings (1–5 Stars)</text>
    <text x="650" y="222">• Mistake History (Hill/S-Bend)</text>
  </g>

  <!-- Connector: Input -> Process -->
  <line x1="480" y1="245" x2="480" y2="274" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)" />

  <!-- ==================== 3. AI / ML PROCESS (RECTANGLE) ==================== -->
  <g transform="translate(110, 276)">
    <rect width="740" height="92" rx="8" fill="url(#process-grad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#card-shadow)" />
    
    <!-- Process Badge -->
    <rect x="250" y="10" width="240" height="22" rx="4" fill="#6d28d9" />
    <text x="370" y="25" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800" letter-spacing="0.4">
      PROCESS: MULTI-FACTOR ML ENGINE
    </text>

    <!-- Details -->
    <g transform="translate(25, 48)" font-size="10.5" fill="#1e293b" font-weight="600">
      <text x="0" y="14">• Multi-factor weighted synthesis: Statutory prerequisites + Road hours + Maneuver consistency</text>
      <text x="0" y="32">• Automated risk pattern detection: Flags critical faults (Hill start rollback, S-bend curb clipping)</text>
      <text x="590" y="23" font-weight="700" fill="#6d28d9">Score: 0% – 100%</text>
    </g>
  </g>

  <!-- Connector: Process -> Decision -->
  <line x1="480" y1="368" x2="480" y2="397" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />

  <!-- ==================== 4. DECISION (DIAMOND / RHOMBUS) ==================== -->
  <!-- Center is at (480, 465). Top: (480, 400), Right: (630, 465), Bottom: (480, 530), Left: (330, 465) -->
  <g filter="url(#diamond-shadow)">
    <polygon points="480,400 630,465 480,530 330,465" fill="url(#decision-grad)" stroke="#d97706" stroke-width="2.5" />
    
    <text x="480" y="445" text-anchor="middle" fill="#b45309" font-size="9.5" font-weight="800" letter-spacing="0.5">
      DECISION GATE
    </text>
    <text x="480" y="465" text-anchor="middle" fill="#78350f" font-size="12.5" font-weight="700">
      Is Readiness Score
    </text>
    <text x="480" y="485" text-anchor="middle" fill="#92400e" font-size="14" font-weight="800">
      ≥ 80% (Trial Ready)?
    </text>
  </g>

  <!-- ==================== BRANCH 1: YES PATH (LEFT) ==================== -->
  <!-- Path from Diamond Left (330, 465) -> Leftwards to (240, 465) -> Downwards to (240, 560) -->
  <polyline points="330,465 240,465 240,560" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
  
  <!-- Yes Badge -->
  <rect x="250" y="447" width="65" height="22" rx="4" fill="#059669" />
  <text x="282.5" y="462" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="800">
    YES [≥80%]
  </text>

  <!-- YES Output Box (Green) -->
  <g transform="translate(50, 564)">
    <rect width="380" height="135" rx="8" fill="url(#yes-box-grad)" stroke="#10b981" stroke-width="1.8" filter="url(#card-shadow)" />
    
    <rect x="15" y="12" width="220" height="22" rx="4" fill="#047857" />
    <text x="125" y="27" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">
      TIER 1: TRIAL READY (QUALIFIED)
    </text>

    <g transform="translate(18, 50)" font-size="10" fill="#1e293b" font-weight="600">
      <text x="0" y="14" fill="#065f46" font-weight="700">✔ Composite Score ≥ 80% Achieved</text>
      <text x="0" y="32">• Issues 1-Click DMT Werahera Practical Trial Slip</text>
      <text x="0" y="50">• Generates Printable A4 Student Driving Logbook</text>
      <text x="0" y="68">• Updates Learner Pipeline to Stage 6 (Verified)</text>
    </g>
  </g>

  <!-- Connector: Yes Box -> Terminal -->
  <line x1="240" y1="699" x2="240" y2="732" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <!-- YES Terminal (End) -->
  <g transform="translate(85, 734)">
    <rect width="310" height="38" rx="19" fill="url(#yes-term-grad)" stroke="#6ee7b7" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="155" y="23" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">
      END: Qualified for DMT Practical Trial
    </text>
  </g>

  <!-- ==================== BRANCH 2: NO PATH (RIGHT) ==================== -->
  <!-- Path from Diamond Right (630, 465) -> Rightwards to (720, 465) -> Downwards to (720, 560) -->
  <polyline points="630,465 720,465 720,560" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  
  <!-- No Badge -->
  <rect x="645" y="447" width="65" height="22" rx="4" fill="#dc2626" />
  <text x="677.5" y="462" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="800">
    NO [&lt;80%]
  </text>

  <!-- NO Output Box (Red) -->
  <g transform="translate(530, 564)">
    <rect width="380" height="135" rx="8" fill="url(#no-box-grad)" stroke="#ef4444" stroke-width="1.8" filter="url(#card-shadow)" />
    
    <rect x="15" y="12" width="220" height="22" rx="4" fill="#b91c1c" />
    <text x="125" y="27" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">
      TIER 2: NEEDS PRACTICE (REMEDIAL)
    </text>

    <g transform="translate(18, 50)" font-size="10" fill="#1e293b" font-weight="600">
      <text x="0" y="14" fill="#991b1b" font-weight="700">✘ Composite Score &lt; 80% (Risk Detected)</text>
      <text x="0" y="32">• Generates Dynamic Deficient Skill Checklist</text>
      <text x="0" y="50">• Launches Adaptive AI Remedial Practice Quiz</text>
      <text x="0" y="68">• Prompts Instructor to Schedule Targeted Lessons</text>
    </g>
  </g>

  <!-- Connector: No Box -> Remedial Terminal -->
  <line x1="720" y1="699" x2="720" y2="732" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />

  <!-- NO Terminal -->
  <g transform="translate(565, 734)">
    <rect width="310" height="38" rx="19" fill="url(#no-term-grad)" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="155" y="23" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">
      REMEDIATE: Complete Practice Sessions
    </text>
  </g>

  <!-- ==================== CLOSED-LOOP RETEST PATH (FEEDBACK LOOP) ==================== -->
  <!-- Loops from Remedial Terminal rightwards, upwards, and back into Data Input -->
  <path d="M 875 753 L 935 753 L 935 195 L 852 195" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-loop)" />
  <rect x="880" y="460" width="54" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="907" y="473" text-anchor="middle" fill="#475569" font-size="8" font-weight="700">RETRAIN &amp;</text>
  <text x="907" y="482" text-anchor="middle" fill="#475569" font-size="8" font-weight="700">RE-EVALUATE</text>

</svg>
